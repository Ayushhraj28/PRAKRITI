    <path d="M1280 560 q-12 -30 0 -50 q12 20 0 50z"/><path d="M1280 560 q-30 -18 -40 -40 q30 6 40 40z"/><path d="M1280 560 q30 -18 40 -40 q-30 6 -40 40z"/>
