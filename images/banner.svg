  </defs>
  <rect width="1600" height="600" fill="url(#sky)"/>
  <circle cx="1320" cy="140" r="70" fill="#f2c14e"/>
  <circle cx="1320" cy="140" r="95" fill="#f2c14e" opacity="0.25"/>
