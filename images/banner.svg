      <stop offset="0" stop-color="#cfe8f5"/>
      <stop offset="1" stop-color="#f5f9f1"/>
    </linearGradient>
    <linearGradient id="field1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb85a"/>
      <stop offset="1" stop-color="#3e7b27"/>
    </linearGradient>
    <linearGradient id="field2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7d58a"/>
      <stop offset="1" stop-color="#6aa84f"/>
